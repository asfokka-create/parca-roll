<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parça Roll — Ultimate Workshop</title>
<style>
:root{--bg:#0b1410;--p:#12211a;--p2:#1a2f25;--ln:#28463a;--tx:#e6efe9;--mu:#8aa498;--ac:#e0a458;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
#top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--ln)}

.mu{color:var(--mu);font-size:13px}
#panel{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.card{--c:var(--ln);min-height:210px;border:2px solid var(--c);border-radius:16px;background:var(--p);padding:16px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;overflow:hidden}
.card.r3{box-shadow:0 0 22px var(--c)}
.card.r4{box-shadow:0 0 34px var(--c);animation:gl 1.1s infinite alternate}

.card.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.card.r4.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1),gl 1.1s .35s infinite alternate}
@keyframes pop{from{transform:scale(.8);opacity:.4}}
.ic{font-size:54px;line-height:1}
.nm{font-size:20px;font-weight:800;color:var(--c)}
.sb{color:var(--mu);font-size:13px}
.cn{color:var(--ac);font-weight:700;margin-top:4px}.cn span{color:var(--mu);font-weight:400;font-size:12px}
.tg{position:absolute;top:10px;right:10px;background:var(--ac);color:#1b1206;font-weight:800;font-size:12px;padding:3px 8px;border-radius:8px}
.rb{position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,#f33,#fa3,#3d6,#3af,#a5f,#f33);background-size:200% 100%}
.v3 .rb{animation:rbm 2s linear infinite}
@keyframes rbm{to{background-position:200% 0}}
.rw{display:flex;gap:8px;margin:12px 0 8px}
.rbtn{flex:1;position:relative;overflow:hidden;min-height:64px;border:0;border-radius:14px;background:#3a2c14;color:#1b1206;font-size:22px;font-weight:900;touch-action:manipulation}
#bar{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#f0b96a,#c98a3e);width:100%}
.rbtn em{position:relative;font-style:normal}
.rbtn:active{filter:brightness(1.15)}
.ab{min-width:96px;border:1px solid var(--ln);border-radius:14px;background:var(--p2);color:var(--tx);font-weight:700;font-size:13px;padding:6px}
.hs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ch{width:36px;height:36px;border:2px solid;border-radius:9px;background:var(--p2);display:flex;align-items:center;justify-content:center;font-size:18px}
.sec{margin:14px 0 6px;font-weight:700;display:flex;justify-content:space-between}
.gr{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ix{border:2px solid var(--c);border-radius:12px;background:var(--p);padding:9px;min-height:70px}
.ix b{display:block;font-size:13px;color:var(--c)}.ix small{color:var(--mu);font-size:11px}
.ix.lk{opacity:.5;border-style:dashed}.ix.lk b{color:var(--mu)}
.row{display:flex;gap:8px;align-items:center;background:var(--p2);border-radius:12px;padding:10px;margin-bottom:8px}
.t{flex:1;min-width:0}.row b{display:block}.row small{color:var(--mu);display:block}
.b{min-width:92px;min-height:48px;border:0;border-radius:10px;background:linear-gradient(#f0b96a,#c98a3e);color:#1b1206;font-weight:800;padding:6px 8px}
.b:disabled{background:#2b3d34;color:#6f8a7c}
#nav{display:flex;overflow-x:auto;flex-shrink:0;background:#08100c;border-top:1px solid var(--ln)}
#nav button{flex:1 0 68px;min-width:68px;min-height:56px;border:0;background:none;color:var(--mu);font-size:11px;padding:3px 2px}
#nav .on{color:var(--ac)}#nav i{display:block;font-style:normal;font-size:20px}
#ts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);background:var(--p2);border:1px solid var(--ac);border-radius:20px;padding:8px 14px;z-index:30;display:none;max-width:90%;text-align:center}
#nav button{position:relative}
#nb{position:absolute;top:5px;left:calc(50% + 10px);background:#ff3d7f;color:#fff;border-radius:10px;font:800 11px/16px system-ui;min-width:18px;padding:0 5px;text-decoration:none}#nb:empty{display:none}
.im{display:flex;justify-content:center;width:100%}.im svg{width:min(62%,200px);height:auto;filter:drop-shadow(0 0 8px var(--c))}
.ib svg{width:100%;height:auto;display:block}.ix{position:relative}.ix.lk .ib svg{filter:brightness(0) invert(.25)}
.nw{position:absolute;top:6px;right:6px;z-index:2;background:#ff3d7f;color:#fff;font:800 10px/1 system-ui;padding:3px 6px;border-radius:6px}
.ch{width:48px;height:36px;padding:2px}.ch svg{width:100%;height:100%}
.rgbb{animation:hue 3s linear infinite}@keyframes hue{to{filter:hue-rotate(360deg)}}
.shn{animation:shn 2.4s linear infinite}@keyframes shn{from{transform:translateX(-30px)}to{transform:translateX(170px)}}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--c) 32%,transparent),transparent 66%);pointer-events:none}
.card>*{position:relative}.card .tg,.card .rb{position:absolute}
.im svg{width:min(72%,240px)}
.pl{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px}
.pl button{flex:0 0 auto;min-height:40px;border:1px solid var(--ln);border-radius:20px;background:var(--p2);color:var(--tx);padding:4px 12px;font-weight:700}
.pl .on{border-color:var(--ac);color:var(--ac)}.pl small{color:var(--mu)}
.ix small{display:block}.card .oc{color:var(--c);font-weight:700;font-size:14px}
html,body{background:radial-gradient(120% 60% at 50% 0,#14271f,#0b1410 60%)}
.cp{background:#2a2110;border:1px solid #6b5420;border-radius:20px;padding:4px 12px}
#pg{height:4px;background:#0e1a14}#pgi{display:block;height:100%;width:0;background:linear-gradient(90deg,#e0a458,#ff3d7f);transition:width .4s}
.card{border-radius:20px}
.rib{position:absolute!important;top:10px;left:10px;background:var(--c);color:#0b1410;font:900 11px/1 system-ui;padding:4px 9px;border-radius:7px;letter-spacing:.5px;z-index:2}
.rbtn{border-radius:18px;min-height:72px;box-shadow:0 6px 0 #1d1508,0 10px 24px #e0a45844}.rbtn:active{transform:translateY(3px);box-shadow:0 3px 0 #1d1508}
.rbtn.rdy{animation:pls 1.4s infinite}@keyframes pls{50%{box-shadow:0 6px 0 #1d1508,0 0 34px #e0a458aa}}
.row{background:linear-gradient(180deg,#1f3529,#1a2f25);border:1px solid #28463a}
.ix{border-radius:14px;background:linear-gradient(180deg,var(--p2),var(--p))}.ib svg{border-radius:8px}
#nav{background:rgba(8,16,12,.94)}#nav .on{background:linear-gradient(0deg,#e0a45826,transparent)}
.card.r5,.card.r6,.card.r7{box-shadow:0 0 44px var(--c);animation:gl 1s infinite alternate}
.card.r5.pop,.card.r6.pop,.card.r7.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1),gl 1s .35s infinite alternate}
.card.r7 .nm{text-shadow:0 0 14px var(--c)}
#fx{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--c) 38%,#000),#000 72%);cursor:pointer}
#fx.on{display:flex;animation:fxin .25s ease-out}@keyframes fxin{from{opacity:0}}
.fxr{position:absolute;left:50%;top:45%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--c) 55%,transparent) 0 6deg,transparent 6deg 18deg);animation:spin 9s linear infinite;opacity:.55;-webkit-mask:radial-gradient(circle,#000 4%,transparent 52%);mask:radial-gradient(circle,#000 4%,transparent 52%)}
@keyframes spin{to{transform:rotate(360deg)}}
#fx.s7 .fxr{animation:spin 6s linear infinite,hue 2.5s linear infinite}
.fxc{position:relative;text-align:center;padding:20px;max-width:440px}
.fxt{font:900 clamp(30px,10vw,54px)/1 system-ui;letter-spacing:2px;color:var(--c);text-shadow:0 0 20px var(--c),0 0 50px var(--c);animation:zoom .6s cubic-bezier(.2,1.8,.4,1)}
@keyframes zoom{from{transform:scale(.2);opacity:0}}
.fxi svg{width:min(74vw,300px);height:auto;filter:drop-shadow(0 0 24px var(--c));animation:zoom .8s .15s both cubic-bezier(.2,1.8,.4,1)}
.fxn{font:800 20px system-ui;margin-top:8px}.fxo{font-weight:800;color:var(--c);font-size:20px;margin-top:4px}.fxh{color:var(--mu);font-size:12px;margin-top:14px}
#fx.s4 .fxc{animation:shk .5s 2}#fx.s5 .fxc,#fx.s6 .fxc,#fx.s7 .fxc{animation:shk .5s 4}
@keyframes shk{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(6px,3px)}}
.fxp{position:absolute;left:50%;top:45%;width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);animation:pf 1.4s ease-out forwards}
@keyframes pf{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.rbtn.rdy,.card.r5,.card.r6,.card.r7,.fxr,.fxp,.fxc,.fxt,.fxi svg{animation:none}}
@media (prefers-reduced-motion:reduce){.card,.card.pop,.card.r4,.v3 .rb,.rgbb,.shn{animation:none}}
.itemtap{cursor:pointer;transition:transform .12s,border-color .12s}.itemtap:active{transform:scale(.98)}.itemtap:focus-visible{outline:2px solid var(--ac)}
#detail{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:#000b;padding:12px}
#detail.on{display:flex}.dcard{width:min(100%,600px);max-height:86vh;overflow:auto;background:var(--p);border:1px solid var(--ln);border-radius:20px;padding:16px;box-shadow:0 12px 50px #0009}
.dhead{display:flex;align-items:center;gap:12px}.dhead .ib{width:112px;flex-shrink:0}.dhead h2{font-size:17px;margin:0 0 6px}.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.dstat{background:var(--p2);padding:10px;border-radius:10px}.dstat small{display:block;color:var(--mu);font-size:11px}.dstat b{font-size:14px}.dclose{width:100%;margin-top:12px;min-height:44px;border:0;border-radius:12px;background:var(--ac);color:#1b1206;font-weight:800}.feature{background:linear-gradient(145deg,#1c3327,#101c16);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:0 0 10px}.feature h2{font-size:19px;margin:0 0 6px}.feature h3{font-size:15px;margin:0 0 5px}.feature p{color:var(--mu);font-size:13px;margin:5px 0 10px}.frow{display:flex;gap:10px;align-items:center;justify-content:space-between}.fbtn{border:0;border-radius:10px;background:linear-gradient(#f0b96a,#c98a3e);color:#1b1206;font-weight:900;padding:10px 12px;min-height:42px}.fbtn:disabled{background:#2b3d34;color:#6f8a7c}.meter{height:7px;border-radius:10px;background:#09110d;overflow:hidden;margin:8px 0}.meter i{display:block;height:100%;background:linear-gradient(90deg,#e0a458,#ff3d7f)}.tagrow{display:flex;gap:6px;flex-wrap:wrap}.tagpill{background:#0b1711;border:1px solid var(--ln);border-radius:20px;padding:5px 9px;font-size:12px;color:var(--mu)}.secret{border-color:#ff3d7f;background:linear-gradient(145deg,#34172c,#15101b)}

/* PARÇA ROLL: görsel yenileme */
:root{--bg:#080b14;--p:#101725;--p2:#172236;--ln:#2b3b57;--tx:#edf3ff;--mu:#93a5c3;--ac:#7ce7ff}
html,body{background:radial-gradient(100% 70% at 50% -10%,#263c69 0%,#101725 42%,#080b14 100%);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:820px;background:linear-gradient(180deg,#0b1220cc,#080b14ee);border-left:1px solid #ffffff0a;border-right:1px solid #ffffff0a;box-shadow:0 0 70px #0007}
#top{padding:13px 16px;background:#0a1120d9;backdrop-filter:blur(16px);position:relative;z-index:4;border-bottom:1px solid #334866}
#co{font-size:26px;color:#8cf0ff;text-shadow:0 0 22px #42cfff55}
#panel{padding:14px 14px 20px;scrollbar-color:#3d5b81 #0a1120}
.card{min-height:300px;border-radius:24px;background:linear-gradient(145deg,#19283e,#0b1220 70%);border:1px solid color-mix(in srgb,var(--c) 80%,#fff 0%);box-shadow:inset 0 1px #ffffff16,0 18px 44px #0005;gap:9px;padding:20px}
.card::before{background:radial-gradient(ellipse at 50% 35%,color-mix(in srgb,var(--c) 30%,transparent),transparent 67%)}
.card .im{max-width:360px;margin:2px auto}.im svg{width:min(90%,320px);filter:drop-shadow(0 12px 14px #0009) drop-shadow(0 0 12px color-mix(in srgb,var(--c) 28%,transparent))}
.card .nm{font-size:clamp(19px,4vw,25px);line-height:1.15;max-width:100%;overflow-wrap:anywhere;text-shadow:0 2px 14px #0008}
.card .sb,.card .oc{font-size:13px;letter-spacing:.15px}.card .cn{font-size:20px}
.rw{gap:10px;margin:14px 0}.rbtn{background:linear-gradient(135deg,#a1f3ff,#42b4e8 50%,#6877f5);color:#071321;box-shadow:0 6px 0 #245079,0 10px 30px #43c9ff33;min-height:76px;font-size:25px;letter-spacing:1px}.rbtn #bar{display:none}.rbtn em{position:relative}.rbtn:active{transform:translateY(3px);box-shadow:0 3px 0 #245079}
.ab,.b,.fbtn{background:linear-gradient(135deg,#243b5a,#17263d);border:1px solid #45668d;color:#eaf5ff;box-shadow:inset 0 1px #ffffff12}.ab{font-size:12px;min-width:80px}.b:disabled,.fbtn:disabled{background:#141b28;color:#61718c;border-color:#29354a}
.sec{margin-top:18px;color:#e8f5ff}.gr{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ix{min-width:0;overflow:hidden;border:1px solid color-mix(in srgb,var(--c) 65%,#30425c);background:linear-gradient(155deg,#1a263a,#0e1522 78%);box-shadow:inset 0 1px #ffffff0b,0 8px 18px #0002;padding:9px;transition:transform .15s,border-color .15s,box-shadow .15s}
.ix.itemtap:hover,.ix:focus-visible{transform:translateY(-2px);box-shadow:0 8px 24px #0005,0 0 0 1px var(--c)}
.ix .ib{min-height:88px;display:flex;align-items:center;justify-content:center;margin-bottom:5px;background:radial-gradient(ellipse at 50% 65%,color-mix(in srgb,var(--c) 17%,transparent),transparent 70%);border-radius:10px}.ix .ib svg{width:100%;max-width:220px;max-height:116px;object-fit:contain}
.ix b{font-size:12px;line-height:1.25;overflow-wrap:anywhere;margin:4px 0}.ix small{font-size:10px;line-height:1.35;overflow-wrap:anywhere}
.ix.lk{opacity:.68;filter:saturate(.55)}.ix.lk .ib{min-height:70px}
#nav{background:#080d18f2;border-top:1px solid #2d4260;backdrop-filter:blur(16px);padding-bottom:env(safe-area-inset-bottom,0px)}#nav button{min-height:60px;color:#93a5c3}#nav .on{color:#8cf0ff;background:linear-gradient(0deg,#58d7ff19,transparent);box-shadow:inset 0 2px #7ce7ff}
.feature{background:linear-gradient(145deg,#18263b,#0e1522);border:1px solid #2c4160;box-shadow:0 8px 24px #0002}.tagpill{background:#0b1320;border-color:#30445f;color:#b8c8e1}.meter{background:#080e19}.meter i{background:linear-gradient(90deg,#7ce7ff,#8c85ff,#ff6cbd)}
#detail{align-items:center;background:#020611d9;backdrop-filter:blur(10px)}.dcard{background:linear-gradient(150deg,#1a2940,#0c1320);border-color:#3a5275}.dstat{background:#111e31;border:1px solid #283c58}.dclose{background:linear-gradient(135deg,#a1f3ff,#42b4e8);color:#071321}
#ts{background:#16243a;border-color:#7ce7ff;color:#effaff;box-shadow:0 8px 28px #0007}
.pl button,.seg button{border-color:#30445f;background:#111d30;color:#c6d5eb}.pl button.on,.seg button.on{border-color:#7ce7ff;color:#8cf0ff;background:#15334a}

/* Multiplayer event hub */
.evhero{position:relative;overflow:hidden;border:1px solid #365b84;border-radius:20px;padding:17px;background:radial-gradient(ellipse at 100% 0%,#5b78ff33,transparent 48%),linear-gradient(140deg,#142a43,#0b1220 78%);box-shadow:0 12px 32px #0004;margin-bottom:12px}
.evhero h2{font-size:21px;margin:2px 0 8px}.evhero p{color:#a9bdd8;font-size:12px;line-height:1.5;margin:6px 0}
.evclock{font-size:22px;font-weight:900;letter-spacing:1px;color:#8ceaff}.evtabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}.evtabs button{border:1px solid #304967;background:#101d30;color:#b9cbe3;padding:11px 8px;border-radius:12px;font-weight:800}.evtabs button.on{border-color:#7ce7ff;color:#9af0ff;background:#17354b;box-shadow:0 0 18px #43c9ff1c}
.evstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}.evstat{background:#0b1524;border:1px solid #2b415e;border-radius:12px;padding:10px 7px;text-align:center;min-width:0}.evstat b{display:block;font-size:17px;color:#eef8ff;overflow-wrap:anywhere}.evstat small{display:block;color:#91a8c6;font-size:10px;margin-top:3px}
.evroll{width:100%;padding:15px;border:0;border-radius:13px;background:linear-gradient(120deg,#a1f3ff,#62c7ff,#8e91ff);color:#071321;font-weight:950;font-size:17px;box-shadow:0 5px 0 #2a507e;margin:5px 0 12px}.evitem{display:flex;align-items:center;gap:12px;padding:11px;border:1px solid #314867;border-radius:14px;background:#111e30;margin:8px 0}.evitem .ib{width:105px;flex-shrink:0}.evitem .ib svg{width:100%}.evitem b{font-size:13px;display:block;overflow-wrap:anywhere}.evitem small{font-size:11px;color:#a5bad5;display:block;margin-top:4px}.evinput{width:100%;box-sizing:border-box;background:#0b1524;border:1px solid #365271;border-radius:10px;color:#f0f7ff;padding:11px;margin:6px 0}.evleader{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:9px;padding:10px 9px;border-bottom:1px solid #263b56}.evleader:first-child{border-top:1px solid #263b56}.evrank{font-size:18px;text-align:center}.evname{font-size:12px;font-weight:800;overflow-wrap:anywhere}.evname small{display:block;color:#8ea6c5;font-weight:500;font-size:10px;margin-top:3px}.evscore{text-align:right;font-size:12px;font-weight:900;color:#9ceeff}.evscore small{display:block;color:#8ea6c5;font-size:10px;font-weight:500}.evnotice{border:1px dashed #526d90;border-radius:12px;padding:11px;color:#a8bdd7;font-size:11px;line-height:1.5;margin-top:10px}.evupgrade{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #263b56}.evupgrade b{font-size:12px}.evupgrade small{display:block;color:#9bb0cc;font-size:10px;margin-top:3px}
@media(min-width:600px){.gr{grid-template-columns:repeat(3,minmax(0,1fr))}.card{min-height:340px}.ix .ib{min-height:110px}}

function eventBots(){let seed=(EVS.cycle+17)*7919;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};const names=['ByteKral','RTXAvcısı','MaviDevre','FanUstası','PikselKorsanı','RAMRoketi','SSDŞimşeği','BIOSBüyücüsü'];return names.map((name,i)=>{let id=Math.floor(rnd()*IT.length),r=IT[id].r; if(i===0&&EVS.cycle%3===0){const maxR=Math.max(...IT.map(it=>it.r));const top=PL[maxR]||[];id=top[Math.floor(rnd()*Math.max(1,top.length))]??id;r=IT[id].r}let v=rnd()>.985?3:rnd()>.9?2:1;return{name,id,r,v,score:(r+1)*100000+v*1000+Math.floor(rnd()*850),bot:true,rolls:Math.floor(20+rnd()*1800)}})}

 if(c===5){let w=(n.match(/(\d{3,4})\s?W/i)||[])[1];rows.push(["Güç",w?w+" W":"Model adına göre belirtilmemiş"],["Verimlilik",/Titanium/i.test(n)?"80 PLUS Titanium":/Platinum/i.test(n)?"80 PLUS Platinum":/Gold/i.test(n)?"80 PLUS Gold":/Bronze/i.test(n)?"80 PLUS Bronze":"Sertifika modeline göre kontrol edilmeli"],["Önemli not","GPU güç bağlantısı ve ATX sürümünü kontrol et"]);}
 if(c===6){rows.push(["Tür",/Liquid|Kraken|iCUE|H[0-9]{3}|360|420|240|280|AIO/i.test(n)?"Sıvı soğutma veya fan/AIO modeli":"Hava soğutma / aksesuar"],["Önemli not","Kasa boşluğu, radyatör boyutu ve CPU soket uyumunu kontrol et"]);}
 if(c===7){rows.push(["Tür","Bilgisayar kasası"],["Uyumluluk","Anakart boyutu ve GPU uzunluğu kontrol edilmeli"],["Önemli not","Radyatör ve fan yerleşimi kasa modeline göre değişir"]);}
 return rows;
}

const n=S.d.filter(x=>x).length;let h=`<div class="mu">Toplam ${n}/${IT.length} · tamamlanan kategori ${done()}/8 · her 10 parça +%1 şans · 💵 Değer ≈ ${fm$(S.d.reduce((a,d,i)=>a+(d?pr(i)[0]:0),0))}</div><div class="pl">`+CT.map(([nm,ic],k)=>{const q=CI[k].filter(i=>S.d[i]).length;return`<button data-c="${k}" class="${k==ixc?"on":""}">${ic} ${nm}${S.nw.some(i=>IT[i].c==k)?" 🔴":""} <small>${q}/${CI[k].length}</small></button>`}).join("")+`</div><div class="seg">${["Hepsi","Bulunan","Eksik"].map((l,j)=>`<button data-f="${j}" class="${j==ixf?"on":""}">${l}</button>`).join("")}</div><div class="gr">`;
CI[ixc].filter(i=>!ixf||(ixf==1)==!!S.d[i]).forEach(i=>{const r=IT[i].r,d=S.d[i];h+=d?`<div class="ix itemtap" data-item="${i}" role="button" tabindex="0" style="--c:${RR[r][1]}">${S.nw.includes(i)?'<span class="nw">YENİ</span>':""}<div class="ib">${art(i,d)}</div><b>${IT[i].n}</b><small>${RR[r][0]} · ${VN[d]} · x${S.q[i]}</small><small>Şans ${od1(i)}</small><small>💵 ${pc(i)}</small></div>`:`<div class="ix lk itemtap" data-item="${i}" role="button" tabindex="0" style="--c:${RR[r][1]}"><b>???</b><small>${RR[r][0]}</small><small>Şans ${od1(i)}</small><small>💵 ${pc(i)}</small></div>`});
$("#panel").innerHTML=h+`</div>`;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab));upd()}

// --- Online connection: browser uses only the public/publishable key. Never put service_role here. ---
const ON_CFG_KEY='parcaroll_supabase_config_v1';
let onClient=null,onUser=null,onRealtime=null,onBusy=false;
function readOnlineConfig(){try{return Object.assign({url:'',key:''},JSON.parse(localStorage.getItem(ON_CFG_KEY)||'{}'))}catch(e){return {url:'',key:''}}}
function escapeOnline(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function onlineMessage(msg,type=''){const el=document.getElementById('onStatus');if(el){el.className='on-status '+type;el.textContent=msg}}
function onlineUI(){const cfg=readOnlineConfig();const connected=!!onClient;return `<div class="online-wrap"><div class="on-card"><span class="on-pill">☁️ ÇEVRİM İÇİ</span><h2 style="margin-top:9px">Parça Roll Online</h2><p>Supabase bağlantısı, gerçek oyuncu hesapları ve ortak skor tablosu. Bu ekrandaki anahtar yalnızca herkese açık Publishable/anon anahtarı olmalıdır. <b>service_role / secret anahtarını buraya asla yazma.</b></p><div id="onStatus" class="on-status ${connected?'ok':''}">${connected?'Supabase bağlantısı hazır.':'Önce proje bilgilerini ekle ve bağlan.'}</div><label class="on-label" for="onUrl">Project URL</label><input class="on-input" id="onUrl" type="url" placeholder="https://xxxx.supabase.co" value="${escapeOnline(cfg.url)}" autocomplete="url"><label class="on-label" for="onKey">Publishable key (veya eski anon public key)</label><input class="on-input" id="onKey" type="password" placeholder="sb_publishable_…" value="${escapeOnline(cfg.key)}" autocomplete="off"><div class="on-actions"><button class="on-btn primary" id="onSaveConfig">Kaydet ve bağlan</button><button class="on-btn" id="onRefresh">Verileri yenile</button></div><p>Bilgiler bu cihazın tarayıcı kaydında saklanır. Oyunu arkadaşlarınla paylaşacaksan herkes kendi oyun kopyasına kendi proje URL/key bilgisini yazabilir; bunlar proje bazında aynı olur.</p></div>
<div class="on-card"><h3>👤 Oyuncu hesabı</h3><p>Hesap açmak için e-posta ve güçlü bir parola kullan. Supabase e-posta doğrulaması açıksa gelen kutunu kontrol et.</p><label class="on-label" for="onUsername">Oyuncu adı (3–20 karakter, harf/rakam/_)</label><input class="on-input" id="onUsername" maxlength="20" placeholder="OrnekOyuncu" autocomplete="nickname"><label class="on-label" for="onEmail">E-posta</label><input class="on-input" id="onEmail" type="email" placeholder="sen@example.com" autocomplete="email"><label class="on-label" for="onPassword">Parola</label><input class="on-input" id="onPassword" type="password" placeholder="En az 8 karakter önerilir" autocomplete="current-password"><div class="on-actions"><button class="on-btn primary" id="onSignup">Kayıt ol</button><button class="on-btn" id="onLogin">Giriş yap</button><button class="on-btn" id="onLogout">Çıkış yap</button><button class="on-btn" id="onProfileSave">Oyuncu adını kaydet</button></div><div id="onAccount" class="on-status" style="margin-top:10px">${onUser?'Giriş yapıldı: '+escapeOnline(onUser.email||onUser.id):'Henüz giriş yapılmadı.'}</div></div>
<div class="on-card"><h3>🏁 Aktif ve yaklaşan etkinlikler</h3><p>Etkinlikler veritabanından okunur. Başlangıçta boş olması normal; etkinlikleri güvenli biçimde ekleyeceğiz.</p><div id="onEvents"><div class="on-muted">Bağlandıktan sonra veriler burada görünür.</div></div></div>
<div class="on-card"><h3>🏆 Gerçek oyuncu leaderboard'u</h3><p>Skor tablosu tüm oyuncuların ortak verisinden okunur. Skor yazma henüz kapalı; hileyi önlemek için sonraki adımda sunucu tarafı doğrulama ekleyeceğiz.</p><div id="onBoard"><div class="on-muted">Bağlandıktan sonra skorlar burada görünür.</div></div></div>
<div class="on-card"><h3>🔒 Güvenlik durumu</h3><div class="on-muted">✓ Veritabanı RLS politikaları açık<br>✓ Tarayıcıya gizli servis anahtarı koyulmaz<br>✓ Oyuncular doğrudan skor/ödül yazamaz<br>⌛ Sunucu tarafı roll ve etkinlik gönderme fonksiyonları sonraki adımda kurulacak</div></div></div>`}
function saveOnlineConfig(){const url=(document.getElementById('onUrl')?.value||'').trim().replace(/\/$/,''),key=(document.getElementById('onKey')?.value||'').trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)){onlineMessage('Project URL biçimi doğru görünmüyor. Supabase panelindeki Project URL değerini kullan.','err');return}if(!key||key.length<20){onlineMessage('Publishable/anon public key girmen gerekiyor. Secret veya service_role anahtarını kullanma.','err');return}try{localStorage.setItem(ON_CFG_KEY,JSON.stringify({url,key}))}catch(e){};initOnlineClient(true)}
function initOnlineClient(rebuild=false){const cfg=readOnlineConfig();if(!cfg.url||!cfg.key){if(rebuild&&tab==='online')build();return}if(!window.supabase?.createClient){onlineMessage('Supabase istemcisi yüklenemedi. İnternet bağlantını kontrol edip dosyayı yeniden aç.','err');return}try{if(onRealtime){onClient?.removeChannel(onRealtime);onRealtime=null}onClient=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});onClient.auth.getSession().then(({data,error})=>{if(error)throw error;onUser=data.session?.user||null;if(tab==='online')build();refreshOnlineData()}).catch(e=>onlineMessage('Bağlantı hatası: '+e.message,'err'));onClient.auth.onAuthStateChange((_event,session)=>{onUser=session?.user||null;if(tab==='online')build();});onlineMessage('Supabase istemcisi oluşturuldu; oturum ve veriler kontrol ediliyor.','ok');if(rebuild&&tab==='online')build()}catch(e){onClient=null;onlineMessage('Bağlantı kurulamadı: '+e.message,'err')}}
async function authAction(action){if(!onClient){onlineMessage('Önce Project URL ve Publishable key girip Kaydet ve bağlan düğmesine bas.','err');return}const email=(document.getElementById('onEmail')?.value||'').trim(),password=document.getElementById('onPassword')?.value||'',username=(document.getElementById('onUsername')?.value||'').trim();try{onBusy=true;if(action==='signup'){if(!/^[A-Za-z0-9_]{3,20}$/.test(username)){onlineMessage('Oyuncu adı 3–20 karakter olmalı; sadece harf, rakam ve _ kullan.','err');return}if(!email||password.length<8){onlineMessage('E-posta gir ve en az 8 karakterli parola seç.','err');return}const {data,error}=await onClient.auth.signUp({email,password});if(error)throw error;if(data.user&&data.session){onUser=data.user;await setCloudUsername(username);onlineMessage('Hesap oluşturuldu ve giriş yapıldı.','ok')}else{onlineMessage('Kayıt isteği alındı. E-posta doğrulaması açıksa gelen kutunu kontrol et; sonra giriş yap.','ok')}}else if(action==='login'){const {data,error}=await onClient.auth.signInWithPassword({email,password});if(error)throw error;onUser=data.user;onlineMessage('Giriş başarılı.','ok')}else{const {error}=await onClient.auth.signOut();if(error)throw error;onUser=null;onlineMessage('Çıkış yapıldı.','ok')}if(tab==='online')build();await refreshOnlineData()}catch(e){onlineMessage('İşlem tamamlanamadı: '+(e.message||'Bilinmeyen hata'),'err')}finally{onBusy=false}}
async function setCloudUsername(username){if(!onClient||!onUser)return;const {error}=await onClient.from('profiles').update({username}).eq('id',onUser.id);if(error)throw error}
async function saveOnlineUsername(){if(!onClient||!onUser){onlineMessage('Oyuncu adını kaydetmek için giriş yap.','err');return}const username=(document.getElementById('onUsername')?.value||'').trim();if(!/^[A-Za-z0-9_]{3,20}$/.test(username)){onlineMessage('Oyuncu adı 3–20 karakter olmalı; sadece harf, rakam ve _ kullan.','err');return}try{await setCloudUsername(username);onlineMessage('Oyuncu adı kaydedildi.','ok');await refreshOnlineData()}catch(e){onlineMessage('Oyuncu adı kaydedilemedi: '+e.message,'err')}}
async function refreshOnlineData(){if(!onClient){return}const eventsEl=document.getElementById('onEvents'),boardEl=document.getElementById('onBoard');if(eventsEl)eventsEl.innerHTML='<div class="on-muted">Etkinlikler yükleniyor…</div>';if(boardEl)boardEl.innerHTML='<div class="on-muted">Sıralama yükleniyor…</div>';try{const [er,sr]=await Promise.all([onClient.from('events').select('id,title,event_type,starts_at,ends_at,status').order('starts_at',{ascending:false}).limit(20),onClient.from('event_scores').select('event_id,user_id,score,best_rarity_score,updated_at').order('score',{ascending:false}).limit(50)]);if(er.error)throw er.error;if(sr.error)throw sr.error;const events=er.data||[],scores=sr.data||[];let names={};const ids=[...new Set(scores.map(x=>x.user_id))];if(ids.length){const pr=await onClient.from('profiles').select('id,username').in('id',ids);if(pr.error)throw pr.error;for(const p of(pr.data||[]))names[p.id]=p.username}if(eventsEl)eventsEl.innerHTML=events.length?events.map(e=>`<div class="on-row"><div>⚡</div><div><b>${escapeOnline(e.title)}</b><div class="on-muted">${e.event_type==='rare_hunt'?'💎 Nadir Parça Avı':'🤝 Toplu Etkinlik'} · ${escapeOnline(e.status)}</div><div class="on-muted">${new Date(e.starts_at).toLocaleString('tr-TR')} – ${new Date(e.ends_at).toLocaleString('tr-TR')}</div></div><span class="on-pill">${e.status==='active'?'AKTİF':e.status==='finished'?'BİTTİ':'PLANLI'}</span></div>`).join(''):'<div class="on-muted">Henüz etkinlik eklenmemiş. Sonraki adımda 48 saatlik etkinliği ekleyeceğiz.</div>';if(boardEl)boardEl.innerHTML=scores.length?scores.map((x,i)=>`<div class="on-row"><div>${i<3?['🥇','🥈','🥉'][i]:'#'+(i+1)}</div><div><b>${escapeOnline(names[x.user_id]||('Oyuncu_'+x.user_id.slice(0,8)))}</b><div class="on-muted">Etkinlik: ${escapeOnline((events.find(e=>e.id===x.event_id)||{}).title||x.event_id.slice(0,8))}</div></div><div class="on-value">${Number(x.score).toLocaleString('tr-TR')}<div class="on-muted">Nadirlik ${Number(x.best_rarity_score).toLocaleString('tr-TR')}</div></div></div>`).join(''):'<div class="on-muted">Henüz gerçek oyuncu skoru yok. Botlar burada gösterilmez; yalnızca veritabanındaki kayıtlı oyuncular görünür.</div>';const st=document.getElementById('onStatus');if(st){st.className='on-status ok';st.textContent='Veritabanına bağlandı · '+events.length+' etkinlik · '+scores.length+' skor kaydı okundu.'}}catch(e){onlineMessage('Veriler okunamadı: '+e.message+' — Tabloların RLS ve SELECT izinlerini kontrol et.','err');if(eventsEl)eventsEl.innerHTML='<div class="on-muted">Etkinlikler alınamadı.</div>';if(boardEl)boardEl.innerHTML='<div class="on-muted">Skorlar alınamadı.</div>'}}

loadEvent();
try{const _oc=readOnlineConfig();if(_oc.url&&_oc.key)initOnlineClient(false)}catch(e){}
let last=Date.now(),c=0;
build();
setInterval(()=>{const now=Date.now(),d=Math.min(1,Math.max(0,(now-last)/1e3));last=now;c++;
if(S.ao&&S.au){acc+=S.au*.25*(1+.1*(S.tree?.[5]||0))*d;let k=0;while(acc>=1&&k++<5){acc--;doRoll(1,1)}}
if(tab=="roll"){const r=cd-now,b=$("#bar");if(b){b.style.width=(r>0?100-r/(cdt()*10):100)+"%";$("#rb").classList.toggle("rdy",r<=0)}}
if(tab=="multi"&&c%20==0){const el=$("#evclock");if(el){const rem=Math.max(0,evEnd()-Date.now());el.textContent=String(Math.floor(rem/3600000)).padStart(2,"0")+":"+String(Math.floor(rem%3600000/60000)).padStart(2,"0")+":"+String(Math.floor(rem%60000/1000)).padStart(2,"0")}if(evCycle()!==EVS.cycle){loadEvent();build()}}
if(c%4==0){upd();if(dirty&&tab=="idx"&&c%20==0){build();dirty=0}}if(tab=="online"&&c%300==0)refreshOnlineData();
if(c%100==0){save();if(evCycle()!==EVS.cycle){loadEvent();if(tab=="multi")build()}}},50);
</script></body></html>
